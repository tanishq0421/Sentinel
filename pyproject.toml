[project]
name = "sentinel"
version = "0.1.0"
description = "Eval & red-team harness for an agentic customer-support agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "litellm>=1.40",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "psycopg[binary]>=3.1",
    "langgraph>=1.2.6",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "pgvector>=0.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
