# Local dev stack. Ports are published to localhost for development only.
# The production (EC2) compose will NOT publish postgres/redis ports — they stay
# on the internal network; only the dashboard/api are exposed.
services:
  postgres:
    # ParadeDB bundles pgvector (dense) + pg_search/BM25 (sparse) → hybrid RAG.
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      # Host 5433 to avoid clashing with a native Postgres on 5432.
      - "5433:5432"
    volumes:
      # PG18+ images want a single mount at /var/lib/postgresql (data in a subdir).
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380 to avoid clashing with a native/tunnelled Redis on 6379.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
